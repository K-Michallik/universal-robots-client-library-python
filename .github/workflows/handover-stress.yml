name: Program handover stress (temporary)

# Temporary diagnostics for the intermittent "robot connects, then drops"
# failures. In the examples workflow they only hit the first two examples
# after a fresh PolyScope X boot, so each iteration boots URSim again, waits
# for readiness exactly like the examples job, and runs those two examples.
# Failures do not stop the loop, so one job yields a failure rate.

on:
  workflow_dispatch:
  pull_request:

permissions:
  contents: read

jobs:
  stress:
    timeout-minutes: 50
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - {model: ur5e, version: 10.11.0, shard: 1}
          - {model: ur5e, version: 10.11.0, shard: 2}
          - {model: ur5e, version: 10.12.0, shard: 1}
          - {model: ur7e, version: 10.13.0, shard: 1}
          - {model: ur7e, version: 10.13.0, shard: 2}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
      - run: python -m pip install -e .
      - name: Boot URSim and run the first two examples, repeatedly
        env:
          URCL_LOG_LEVEL: DEBUG
          ITERATIONS: "8"
        run: |
          chmod +x scripts/start_ursim.sh
          mkdir -p out
          failures=0
          done_iterations=0
          for i in $(seq 1 "$ITERATIONS"); do
            echo "==== iteration $i $(date +%H:%M:%S)"
            if ! scripts/start_ursim.sh -r -m "${{ matrix.model }}" -v "${{ matrix.version }}" > "out/start-$i.log" 2>&1; then
              echo "start failed"; cat "out/start-$i.log"; continue
            fi
            if ! python scripts/wait_for_ursim_ready.py --robot-ip 192.168.56.101 > "out/ready-$i.log" 2>&1; then
              echo "readiness failed"; cat "out/ready-$i.log"; continue
            fi
            python scripts/primary_monitor.py --robot-ip 192.168.56.101 > "out/monitor-$i.log" 2>&1 &
            monitor=$!
            if python run_examples.py --simulator --robot-ip 192.168.56.101 \
                --only examples.force_mode_example --only examples.full_driver \
                > "out/iter-$i.log" 2>&1; then
              result=passed
            else
              result=FAILED
              failures=$((failures + 1))
            fi
            done_iterations=$((done_iterations + 1))
            sleep 5
            kill "$monitor" || true
            wait "$monitor" || true
            echo "---- iteration $i $result"
            if [ "$result" = FAILED ]; then
              cat "out/ready-$i.log" "out/iter-$i.log" "out/monitor-$i.log"
              docker logs ursim > "out/ursim-$i.log" 2>&1 || true
            fi
          done
          docker rm -f ursim >/dev/null 2>&1 || true
          echo "STRESS SUMMARY ${{ matrix.version }} shard ${{ matrix.shard }}: $failures failed of $done_iterations"
          echo "$failures $done_iterations" > out/failures.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: stress-${{ matrix.version }}-${{ matrix.model }}-${{ matrix.shard }}
          path: out/
          if-no-files-found: warn
          retention-days: 10
      - name: Stop URSim
        if: always()
        run: docker rm -f ursim >/dev/null 2>&1 || true
